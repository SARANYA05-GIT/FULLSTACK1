<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign In / Sign Up</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            width: 800px;
            height: 450px;
            background: #fff;
            border-radius: 12px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .left, .right {
            width: 50%;
            padding: 40px;
        }

        .left {
            background: #f4f6ff;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .left h1 {
            margin-bottom: 10px;
        }

        .left p {
            color: #555;
            margin-bottom: 30px;
        }

        .right {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h2 {
            margin-bottom: 20px;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            margin-top: 15px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #667eea;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #556cd6;
        }

        .switch {
            text-align: center;
            margin-top: 15px;
            color: #555;
        }

        .switch a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }

        /* Hide signup by default */
        #signup {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="left">
        <h1>Welcome!</h1>
        <p>Create an account or sign in to continue</p>
    </div>

    <div class="right">
        <!-- Sign In -->
        <div id="signin">
            <h2>Sign In</h2>
            <input type="text" placeholder="Username">
            <input type="password" placeholder="Password">
            <button>Sign In</button>
            <div class="switch">
                Don't have an account? <a href="#" onclick="showSignup()">Sign Up</a>
            </div>
        </div>

        <!-- Sign Up -->
        <div id="signup">
            <h2>Sign Up</h2>
            <input type="text" placeholder="Username">
            <input type="email" placeholder="Email">
            <input type="password" placeholder="Password">
            <button>Sign Up</button>
            <div class="switch">
                Already have an account? <a href="#" onclick="showSignin()">Sign In</a>
            </div>
        </div>
    </div>
</div>

<script>
    function showSignup() {
        document.getElementById('signin').style.display = 'none';
        document.getElementById('signup').style.display = 'block';
    }

    function showSignin() {
        document.getElementById('signup').style.display = 'none';
        document.getElementById('signin').style.display = 'block';
    }
</script>

</body>
</html>
