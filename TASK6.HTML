<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login & Signup</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            width: 380px;
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        input:invalid {
            border-color: red;
        }

        input:valid {
            border-color: green;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #556cd6;
        }

        p {
            text-align: center;
            margin-top: 15px;
        }

        a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- LOGIN PAGE -->
    <div id="login" class="page active">
        <h2>Sign In</h2>
        <input type="text" placeholder="Username" required minlength="3">
        <input type="password" placeholder="Password" required minlength="6">
        <button>Login</button>
        <p>Don't have an account? <a onclick="showSignup()">Sign Up</a></p>
    </div>

    <!-- SIGNUP PAGE -->
    <div id="signup" class="page">
        <h2>Create Account</h2>
        <input type="text" placeholder="Username" required minlength="3">
        <input type="email" placeholder="Email" required>
        <input type="password" placeholder="Password" required minlength="6">
        <button onclick="register()">Register</button>
        <p>Already have an account? <a onclick="showLogin()">Sign In</a></p>
    </div>

</div>

<script>
    function showSignup() {
        document.getElementById('login').classList.remove('active');
        document.getElementById('signup').classList.add('active');
    }

    function showLogin() {
        document.getElementById('signup').classList.remove('active');
        document.getElementById('login').classList.add('active');
    }

    function register() {
        alert('Signup successful! Redirecting to Login...');
        showLogin();
    }
</script>

</body>
</html>
